# =============================================================
# GROUP 6 — FILEBEAT CONFIGURATION
# DSA 4030: Big Data Security | USIU-Africa
#
# Fix: Filebeat 8.x tries to hit /_license on Elasticsearch
# before sending data. OpenSearch rejects this endpoint.
# Solution: disable monitoring + set allow_older_versions
# so Filebeat skips the compatibility/license check entirely.
# =============================================================

filebeat.inputs:

  # ── INPUT 1: SSH Authentication Logs ────────────────────────────────────────
  - type: log
    enabled: true
    paths:
      - /var/log/group6/ssh_logs.log
    fields:
      log_source: ssh_auth
      source_type: authentication
    fields_under_root: true

  # ── INPUT 2: Web Server Access Logs ─────────────────────────────────────────
  - type: log
    enabled: true
    paths:
      - /var/log/group6/web_logs.log
    fields:
      log_source: web_server
      source_type: web_access
    fields_under_root: true

  # ── INPUT 3: Application Event Logs (Part B dataset) ────────────────────────
  - type: log
    enabled: true
    paths:
      - /var/log/group6/app_logs.json
    fields:
      log_source: application
      source_type: app_events
    fields_under_root: true
    json.keys_under_root: true
    json.add_error_key: true

# ── OUTPUT ────────────────────────────────────────────────────────────────────
# OpenSearch is API-compatible with Elasticsearch.
# allow_older_versions skips the /_license and version handshake
# that Filebeat 8.x normally performs — OpenSearch rejects those calls.
output.elasticsearch:
  hosts: ["http://opensearch:9200"]
  index: "group6-logs-%{+yyyy.MM.dd}"
  allow_older_versions: true

# ── TEMPLATE ──────────────────────────────────────────────────────────────────
setup.template.name: "group6-logs"
setup.template.pattern: "group6-logs-*"
setup.template.enabled: true
setup.template.overwrite: true

# ── DISABLE ILM ───────────────────────────────────────────────────────────────
# ILM (Index Lifecycle Management) also tries to hit Elasticsearch-specific
# endpoints that OpenSearch doesn't support. Disable it entirely.
setup.ilm.enabled: false

# ── DISABLE MONITORING ────────────────────────────────────────────────────────
# Internal monitoring also tries to write to _license-style indices.
# Disabling prevents those 400 errors from blocking the output connection.
monitoring.enabled: false

# ── LOGGING ───────────────────────────────────────────────────────────────────
logging.level: info
logging.to_stderr: true
