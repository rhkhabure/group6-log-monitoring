# =============================================================
# GROUP 6 — FILEBEAT CONFIGURATION
# DSA 4030: Big Data Security | USIU-Africa
#
# This file tells Filebeat:
#   WHERE to read logs from  → filebeat.inputs section
#   WHERE to send logs       → output.opensearch section
#
# Each input creates a separate index in OpenSearch so your
# group can filter by source (SSH / Web / App) in the dashboard.
# =============================================================

filebeat.inputs:

  # ── INPUT 1: SSH Authentication Logs ────────────────────────────────────────
  # Reads the simulated SSH auth log (mirrors /var/log/auth.log format)
  - type: log
    enabled: true
    paths:
      - /var/log/group6/ssh_logs.log      # mounted from ./logs/ on your machine
    fields:
      log_source: ssh_auth               # custom field so you can filter in dashboard
      source_type: authentication
    fields_under_root: true              # puts custom fields at the top level (easier to query)
    multiline.pattern: '^[A-Z][a-z]{2}\s'   # SSH logs start with month abbreviation e.g. "Jul 15"
    multiline.negate: true
    multiline.match: after

  # ── INPUT 2: Web Server Access Logs ─────────────────────────────────────────
  # Reads the simulated Apache/Nginx access log
  - type: log
    enabled: true
    paths:
      - /var/log/group6/web_logs.log      # mounted from ./logs/ on your machine
    fields:
      log_source: web_server              # tag so you can filter these in dashboard
      source_type: web_access
    fields_under_root: true

  # ── INPUT 3: Application Event Logs (Part B dataset) ────────────────────────
  # Reads the JSON Lines file generated by generate_logs.py
  # json.keys_under_root: true → each JSON field becomes a searchable field in OpenSearch
  - type: log
    enabled: true
    paths:
      - /var/log/group6/app_logs.json     # mounted from ./logs/ on your machine
    fields:
      log_source: application             # tag so you can filter these in dashboard
      source_type: app_events
    fields_under_root: true
    json.keys_under_root: true            # parse JSON fields automatically
    json.add_error_key: true              # if a line isn't valid JSON, flag it instead of crashing


# ── OUTPUT: Send everything to OpenSearch via Elasticsearch-compatible API ────
# OpenSearch is fully API-compatible with Elasticsearch.
# Filebeat 8.x uses "output.elasticsearch" to talk to both.
output.elasticsearch:
  hosts: ["http://opensearch:9200"]       # "opensearch" is the Docker service name
  index: "group6-logs-%{+yyyy.MM.dd}"    # creates a daily index e.g. group6-logs-2026.07.16
  allow_older_versions: true              # allows Filebeat 8.x to talk to OpenSearch without version mismatch errors

# ── INDEX TEMPLATE ────────────────────────────────────────────────────────────
setup.template.name: "group6-logs"
setup.template.pattern: "group6-logs-*"
setup.template.enabled: true
setup.ilm.enabled: false                  # disable index lifecycle management (not needed for project)

# ── LOGGING ───────────────────────────────────────────────────────────────────
# Filebeat's own operational logs (not the security logs — Filebeat's own status messages)
logging.level: info
logging.to_files: true
logging.files:
  path: /tmp/filebeat-logs
  name: filebeat
  keepfiles: 3
