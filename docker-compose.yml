# =============================================================
# GROUP 6 — CENTRALIZED LOG MONITORING
# DSA 4030: Big Data Security | USIU-Africa
#
# Simplified stack — Filebeat removed due to Filebeat 8.x vs
# OpenSearch 2.x incompatibility (_license endpoint conflict).
# Log ingestion handled by scripts/ingest_logs.py instead.
#
# Services:
#   1. opensearch         → stores and indexes all logs (port 9200)
#   2. opensearch-dashboards → visual dashboard (port 5601)
#
# Usage:
#   Start:  docker compose up -d
#   Stop:   docker compose down
# =============================================================

version: '3.8'

services:

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: opensearch
    environment:
      - cluster.name=group6-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=false
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - group6-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 8

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    networks:
      - group6-net
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch-data:
    driver: local

networks:
  group6-net:
    driver: bridge
